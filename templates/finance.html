{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">FINANCE</div><h1>财务流水</h1><p>从资金到账到小项结算，每一步都可追溯。</p></div><span class="pill neutral">{{ result_count }} 条记录</span></div><section class="panel"><form class="filter-bar finance-filter" method="get"><input name="q" value="{{ q }}" placeholder="订单、公司、供应商、平台、用途、型号" aria-label="搜索流水"><select name="kind" aria-label="流水类型"><option value="">全部类型</option><option value="receipt" {% if request.GET.kind == 'receipt' %}selected{% endif %}>客户收款</option><option value="payment" {% if request.GET.kind == 'payment' %}selected{% endif %}>供应商付款</option></select><select name="currency" aria-label="币种"><option value="">全部币种</option><option {% if request.GET.currency == 'USD' %}selected{% endif %}>USD</option><option {% if request.GET.currency == 'CNY' %}selected{% endif %}>CNY</option><option {% if request.GET.currency == 'EUR' %}selected{% endif %}>EUR</option><option {% if request.GET.currency == 'HKD' %}selected{% endif %}>HKD</option><option {% if request.GET.currency == 'GBP' %}selected{% endif %}>GBP</option></select><select name="allocation" aria-label="分摊状态"><option value="">全部分摊状态</option><option value="pending" {% if request.GET.allocation == 'pending' %}selected{% endif %}>有未分配余额</option></select><input type="date" name="start" value="{{ request.GET.start }}" aria-label="开始日期"><span class="muted">至</span><input type="date" name="end" value="{{ request.GET.end }}" aria-label="结束日期"><button class="btn secondary">查询</button><a class="text-link" href="/finance/">重置</a></form>{% include 'transaction_table.html' %}{% include 'pagination.html' %}</section>{% endblock %}
