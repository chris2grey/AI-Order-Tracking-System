{% if page_obj %}<div class="pagination"><span>共 {{ result_count }} 条 · 每页 {{ page_obj.paginator.per_page }} 条</span><div>{% if page_obj.has_previous %}<a class="btn secondary" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">上一页</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn secondary" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">下一页</a>{% endif %}</div></div>{% endif %}
